name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Never let two deploys race; let a newer commit supersede an in-flight run.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # The gates that must hold before anything ships. The Playwright
      # suites need a browser and a served app, so they run here too.
      - run: npm run typecheck
      - run: npm test

      - run: npm run build

      # Uses the pinned playwright devDependency, so the browser matches
      # the library the suites import.
      - name: Install Chromium for the acceptance suites
        run: npx playwright install --with-deps chromium

      - name: Layer 1 and Layer 2 acceptance against the built app
        run: |
          npx vite preview --port 5199 --strictPort &
          npx --yes wait-on http://localhost:5199/Gym-/ --timeout 60000
          BASE_URL=http://localhost:5199/Gym-/ node tests/acceptance/layer1.mjs
          BASE_URL=http://localhost:5199/Gym-/ node tests/acceptance/layer2.mjs

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
