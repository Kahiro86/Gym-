<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta name="color-scheme" content="dark" />
<meta name="theme-color" content="#0A0908" />
<title>Habits</title>
<script>
// Retires the cross-origin-isolation service worker this app used to
// install.
//
// Storage now runs on the OPFS access-handle pool VFS, which needs no
// SharedArrayBuffer and therefore no COOP/COEP headers, so the worker has
// nothing left to do. Anyone who loaded an earlier build still has it
// registered, and a service worker outlives the code that installed it —
// so the removal has to be performed here rather than by deleting the
// file and hoping.
//
// No reload follows. The worker only ever added response headers; the
// page works identically with or without it, so tearing it down is not
// worth a flash of reloading in front of the user.
(function () {
  if (!("serviceWorker" in navigator)) return;
  navigator.serviceWorker.getRegistrations().then(
    function (regs) {
      regs.forEach(function (reg) {
        var url = (reg.active && reg.active.scriptURL) || "";
        if (url.indexOf("coi-serviceworker") !== -1) reg.unregister();
      });
    },
    function () { /* nothing to clean up */ },
  );
  try { sessionStorage.removeItem("coi-attempts"); } catch (e) { /* private mode */ }
})();
</script>
</head>
<body>
<div id="root"></div>
<script type="module" src="/src/main.tsx"></script>
</body>
</html>
